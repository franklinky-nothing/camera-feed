<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Camera Feed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000000;
    color: #eaeaea;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #stage {
    width: min(92vw, 960px);
  }
  h1 {
    font-family: "JetBrains Mono", monospace;
    font-weight: 400;
    font-size: clamp(20px, 4vw, 32px);
    letter-spacing: 0.04em;
    text-align: center;
    margin: 0 0 18px;
  }
  video {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 12px;
    background: #111;
    transform: scaleX(-1); /* mirror, like a mirror/webcam preview */
  }
  #status {
    margin-top: 14px;
    text-align: center;
    font-size: 14px;
    color: #9a9a9a;
    min-height: 20px;
  }
  #status.error { color: #e07a7a; }
  button {
    display: block;
    margin: 16px auto 0;
    padding: 10px 20px;
    font-size: 14px;
    background: #1c3f8f;
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  button:hover { background: #2a52b0; }
</style>
</head>
<body>
<div id="stage">
  <h1>hello world</h1>
  <video id="video" autoplay playsinline muted></video>
  <div id="status">Requesting camera access…</div>
  <button id="retry" style="display:none;">Try again</button>
</div>
<script>
  const video = document.getElementById("video");
  const status = document.getElementById("status");
  const retryBtn = document.getElementById("retry");

  async function startCamera() {
    status.textContent = "Requesting camera access…";
    status.classList.remove("error");
    retryBtn.style.display = "none";

    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: false,
      });
      video.srcObject = stream;
      status.textContent = "Live";
    } catch (err) {
      status.textContent = "Couldn't access the camera: " + err.message;
      status.classList.add("error");
      retryBtn.style.display = "block";
    }
  }

  retryBtn.addEventListener("click", startCamera);
  startCamera();
</script>
</body>
</html>
